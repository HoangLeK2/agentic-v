[project]
name = "agentos"
version = "1.0.0"
description = "AgentOS: a production API for agents."
requires-python = ">=3.12,<4"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Agno", email = "hello@agno.com" }]

dependencies = [
  "agno[os,mcp,slack,pgvector,psycopg]==2.8.5",
  "ag-ui-protocol>=0.1.15",
  "cryptography",
  "fastapi",
  "fastmcp==3.4.3",
  "httpx",
  "openai",
  "parallel-web",
  "PyJWT[crypto]",
  "python-dotenv",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["mypy", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "app*", "db*", "evals*", "services*", "workflows*", "workforce*"]
namespaces = false

[tool.ruff]
line-length = 120
exclude = [".venv*", "*.md", "tmp/workforce-workspaces"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = [".venv*", "^tmp/workforce-workspaces/"]
